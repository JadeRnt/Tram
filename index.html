<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaM Live · Montpellier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg:#0a0c10;--surface:#12151c;--border:#1e2330;
  --accent:#e8f439;--accent2:#39c5f4;--text:#e8eaf0;--muted:#5a6272;
  --sidebar:256px;
}
:root.light{
  --bg:#f0f2f5;--surface:#ffffff;--border:#e5e7eb;
  --accent:#6b7a00;--accent2:#0284c7;--text:#111827;--muted:#9ca3af;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;transition:background .25s,color .25s}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:1000;gap:8px}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px}
.logo h1{font-size:.95rem;font-weight:800;letter-spacing:-.02em}
.logo span{display:block;font-family:'Space Mono',monospace;font-size:.55rem;color:var(--muted);letter-spacing:.06em;margin-top:1px}
.hright{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.status-pill{display:flex;align-items:center;gap:6px;background:var(--border);padding:4px 10px;border-radius:999px;font-family:'Space Mono',monospace;font-size:.6rem;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.live{background:#22c55e;animation:pulse 2s infinite}
.dot.error{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#vehicle-count{font-family:'Space Mono',monospace;font-size:.66rem;color:var(--accent);white-space:nowrap}
.ibtn{background:none;border:1px solid var(--border);color:var(--text);padding:4px 9px;border-radius:6px;font-family:'Space Mono',monospace;font-size:.6rem;cursor:pointer;transition:all .15s;letter-spacing:.03em;display:flex;align-items:center;gap:4px;white-space:nowrap}
.ibtn:hover,.ibtn.on{border-color:var(--accent);color:var(--accent)}
.ibtn:disabled{opacity:.35;cursor:not-allowed}

.main{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}

/* Onglets TOUT / TRAM / BUS */
.view-tabs{display:flex;padding:8px 8px 0;gap:3px;flex-shrink:0}
.vtab{flex:1;padding:6px 4px;border:none;border-radius:6px 6px 0 0;font-family:'Space Mono',monospace;font-size:.58rem;cursor:pointer;background:transparent;color:var(--muted);transition:all .15s;text-align:center;letter-spacing:.02em;border-bottom:2px solid transparent}
.vtab:hover{color:var(--text)}
.vtab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:700}

/* Barre actions (tout cocher/décocher) — toujours visible */
.act-bar{display:flex;gap:4px;padding:6px 8px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex-shrink:0}
.abtn{flex:1;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-family:'Space Mono',monospace;font-size:.56rem;cursor:pointer;background:none;color:var(--muted);transition:all .15s;text-align:center}
.abtn:hover{border-color:var(--accent);color:var(--accent)}

/* Scroll */
.sb-scroll{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;padding:4px 0}

/* Entête section */
.sec-hd{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 2px;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface);z-index:2}
.sec-lbl{font-family:'Space Mono',monospace;font-size:.54rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:4px}
.sec-arr{font-size:.55rem;color:var(--muted);transition:transform .2s}
.sec-arr.closed{transform:rotate(-90deg)}

/* Liste routes */
.sec-body{padding:2px 6px 6px}

/* Route + ses directions : pas de bordure, juste du spacing */
.route-block{margin-bottom:1px}

/* En-tête route : badge + nom + count */
.route-head{display:flex;align-items:center;gap:6px;padding:4px 4px;border-radius:5px;cursor:pointer;width:100%;background:none;border:none;color:var(--text);text-align:left;transition:background .12s}
.route-head:hover{background:rgba(128,128,128,.07)}
.route-block.off .route-head{opacity:.3}
.rbadge{min-width:24px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:800;flex-shrink:0;padding:0 3px}
.rbadge.sq{border-radius:3px}
.rbadge.circ{border-radius:50%;width:20px;height:20px}
.rname{font-size:.68rem;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.rcount{font-family:'Space Mono',monospace;font-size:.56rem;color:var(--muted);flex-shrink:0;min-width:16px;text-align:right}

/* Directions : sous le nom, indentées */
.dir-list{padding:1px 0 3px 30px;display:flex;flex-direction:column;gap:1px}
.dir-btn{display:flex;align-items:center;gap:4px;padding:2px 5px;border-radius:4px;cursor:pointer;background:none;border:none;color:var(--text);text-align:left;width:100%;transition:background .1s;opacity:.45}
.dir-btn:hover{background:rgba(128,128,128,.07);opacity:.85}
.dir-btn.on{opacity:1}
.dir-btn.on .dir-pip{opacity:1}
.dir-pip{width:7px;height:7px;border-radius:50%;flex-shrink:0;opacity:.35;transition:opacity .15s}
.dir-lbl{font-size:.62rem;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-ct{font-family:'Space Mono',monospace;font-size:.54rem;color:var(--muted);flex-shrink:0}

/* Stats */
.sb-stats{padding:8px 10px;border-top:1px solid var(--border);flex-shrink:0}
.slbl{font-family:'Space Mono',monospace;font-size:.52rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.stat-card{background:var(--bg);border-radius:5px;padding:6px 8px}
.stat-val{font-family:'Space Mono',monospace;font-size:.95rem;font-weight:700;color:var(--accent);line-height:1}
.stat-lbl{font-size:.5rem;color:var(--muted);margin-top:2px}
.sb-info{padding:5px 10px 7px;font-size:.56rem;color:var(--muted);flex-shrink:0;line-height:1.5}
.sb-info a{color:var(--accent2);text-decoration:none}

/* MAP */
#map{flex:1;background:#0e1117}
#overlay{position:absolute;inset:0;background:rgba(10,12,16,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:12px}
#overlay.hidden{display:none}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ltxt{font-family:'Space Mono',monospace;font-size:.64rem;color:var(--muted);letter-spacing:.07em}

/* Marqueurs */
.vm{display:flex;align-items:center;justify-content:center;border-radius:50%;border:2.5px solid rgba(255,255,255,.88);font-family:'Syne',sans-serif;font-weight:800;font-size:11px;color:white;box-shadow:0 2px 8px rgba(0,0,0,.55);cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.5);line-height:1}
.vm.bus{border-radius:5px!important;font-size:9px!important}
.vm.dk{color:#111!important;text-shadow:none!important;border-color:rgba(0,0,0,.3)!important}
.vw{position:relative;display:inline-flex;align-items:center;justify-content:center}
.va{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-bottom:6px solid rgba(255,255,255,.82);pointer-events:none}
.sdot{width:7px;height:7px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.2)}

/* Popup */
.leaflet-popup-content-wrapper{background:var(--surface)!important;border:1px solid var(--border);border-radius:10px!important;box-shadow:0 4px 20px rgba(0,0,0,.7)!important;color:var(--text)!important;font-family:'Syne',sans-serif}
.leaflet-popup-tip{background:var(--surface)!important}
.leaflet-popup-content{margin:11px 14px!important;min-width:200px;max-width:240px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.pbadge{min-width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;padding:0 5px;flex-shrink:0}
.pbadge.sq{border-radius:4px}
.ptitle{font-weight:800;font-size:.85rem}
.plong{font-size:.57rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:155px}
.phs{font-size:.64rem;color:var(--accent2);margin-top:2px}
.prow{display:flex;justify-content:space-between;align-items:center;font-size:.67rem;padding:3px 0;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.pkey{color:var(--muted)}
.pval{font-family:'Space Mono',monospace;font-size:.62rem;font-weight:700}
.spdb{height:3px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden}
.spdf{height:100%;border-radius:2px}

#error-banner{display:none;background:#160a0a;border-bottom:1px solid #7f1d1d;color:#fca5a5;padding:6px 14px;font-family:'Space Mono',monospace;font-size:.6rem;text-align:center;flex-shrink:0}
.timer-wrap{height:2px;background:var(--border);flex-shrink:0}
.timer-bar{height:100%;background:var(--accent);width:100%}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🚊</div>
    <div><h1>TaM Live</h1><span>MONTPELLIER · TEMPS RÉEL</span></div>
  </div>
  <div class="hright">
    <span id="vehicle-count">— véhicules</span>
    <div class="status-pill"><div class="dot" id="sdot"></div><span id="stxt">Init…</span></div>
    <button class="ibtn" id="stops-btn" onclick="toggleStops()">⬤ ARRÊTS</button>
    <button class="ibtn" id="theme-btn" onclick="toggleTheme()"><span id="ticon">☀️</span><span id="tlbl">LIGHT</span></button>
    <button class="ibtn" id="refresh-btn" onclick="manualRefresh()" disabled>⟳</button>
  </div>
</header>
<div id="error-banner"></div>
<div class="timer-wrap"><div class="timer-bar" id="timer-bar"></div></div>

<div style="position:relative;flex:1;display:flex;overflow:hidden">
  <div id="overlay"><div class="spinner"></div><div class="ltxt" id="ltxt">CHARGEMENT…</div></div>

  <div class="main" style="flex:1;display:flex;overflow:hidden">
    <div class="sidebar">

      <!-- Onglets filtre principal -->
      <div class="view-tabs">
        <button class="vtab on"  id="tab-all"  onclick="setView('all')">TOUT</button>
        <button class="vtab"     id="tab-tram" onclick="setView('tram')">🚊 TRAM</button>
        <button class="vtab"     id="tab-bus"  onclick="setView('bus')">🚌 BUS</button>
      </div>

      <!-- Tout cocher / décocher — toujours visible -->
      <div class="act-bar">
        <button class="abtn" onclick="selectAll(true)">✓ Tout cocher</button>
        <button class="abtn" onclick="selectAll(false)">✗ Tout décocher</button>
      </div>

      <div class="sb-scroll" id="sb-scroll">
        <!-- Trams -->
        <div class="sec-hd" onclick="toggleSec('sec-tram')">
          <div class="sec-lbl">🚊 Trams</div>
          <span class="sec-arr" id="sec-tram-arr">▾</span>
        </div>
        <div class="sec-body" id="sec-tram"></div>

        <!-- Bus -->
        <div class="sec-hd" onclick="toggleSec('sec-bus')">
          <div class="sec-lbl">🚌 Bus</div>
          <span class="sec-arr" id="sec-bus-arr">▾</span>
        </div>
        <div class="sec-body" id="sec-bus"></div>
      </div>

      <div class="sb-stats">
        <div class="slbl">Statistiques</div>
        <div class="stat-grid">
          <div class="stat-card"><div class="stat-val" id="st-tram">–</div><div class="stat-lbl">Trams actifs</div></div>
          <div class="stat-card"><div class="stat-val" id="st-bus">–</div><div class="stat-lbl">Bus actifs</div></div>
          <div class="stat-card" style="grid-column:span 2"><div class="stat-val" style="font-size:.7rem" id="st-upd">–</div><div class="stat-lbl">Dernière MAJ</div></div>
        </div>
      </div>
      <div class="sb-info">
        GTFS-RT <strong>M3M</strong> (ODbL) · 10 s ·
        <a href="https://data.montpellier3m.fr/dataset/offre-de-transport-tam-en-temps-reel" target="_blank">Open Data</a>
      </div>
    </div>

    <div id="map"></div>
  </div>
</div>

function loadScript(src){return new Promise(function(r,j){var s=document.createElement('script');s.src=src;s.onload=r;s.onerror=j;document.head.appendChild(s);});}
function xhrBin(url,ms){return new Promise(function(r,j){var x=new XMLHttpRequest();x.open('GET',url,true);x.responseType='arraybuffer';x.timeout=ms||12000;x.ontimeout=function(){j(new Error('Timeout'));};x.onerror=function(){j(new Error('KO'));};x.onload=function(){x.status>=200&&x.status<300?r(x.response):j(new Error('HTTP '+x.status));};x.send();});}
function xhrJSON(url){return new Promise(function(r,j){var x=new XMLHttpRequest();x.open('GET',url,true);x.timeout=25000;x.ontimeout=function(){j(new Error('Timeout'));};x.onerror=function(){j(new Error('KO'));};x.onload=function(){x.status>=200&&x.status<300?r(JSON.parse(x.responseText)):j(new Error('HTTP '+x.status));};x.send();});}

function getInfo(tripId,routeId){
  var rid=(routeId&&ROUTES[routeId])?routeId:null;
  var headsign=null,dir=-1;
  if(TRIPS&&tripId&&TRIPS.t[tripId]){var e=TRIPS.t[tripId];if(!rid&&e[0]>=0)rid=TRIPS.k[e[0]];headsign=e[1];dir=e[2];}
  return{rid:rid,headsign:headsign,dir:dir};
}

function isVisible(v){
  if(!v.rid) return activeView==='all';
  var isTram=TRAM_IDS.indexOf(v.rid)>=0;
  // Filtre vue globale
  if(activeView==='tram'&&!isTram) return false;
  if(activeView==='bus' && isTram) return false;
  // Filtre direction
  var ps=pickState[v.rid];
  if(!ps) return true;
  if(v.dir===-1) return ps[0]||ps[1];
  return !!ps[v.dir];
}

function buildSidebar(){
  buildSection('sec-tram',TRAM_IDS);
  buildSection('sec-bus', BUS_IDS);
}

function buildSection(cid,ids){
  var c=document.getElementById(cid);
  ids.forEach(function(rid){
    var r=ROUTES[rid]; if(!r) return;
    var isTram=r.type===0;
    // État initial : tout visible
    pickState[rid]={0:true,1:true};

    var block=document.createElement('div');
    block.className='route-block'; block.id='rblock-'+rid;

    // En-tête : clic = toggle les 2 dirs
    var head=document.createElement('button');
    head.className='route-head';
    head.innerHTML=
      '<div class="rbadge'+(isTram?' circ':' sq')+'" style="background:'+r.color+';color:'+r.text+'">'+r.short+'</div>'+
      '<span class="rname">'+r.long+'</span>'+
      '<span class="rcount" id="rc-'+rid+'">–</span>';
    head.onclick=function(){toggleRouteAll(rid);};

    // Directions
    var dl=document.createElement('div');
    dl.className='dir-list'; dl.id='dirs-'+rid;
    [0,1].forEach(function(d){
      var db=document.createElement('button');
      db.className='dir-btn on'; db.id='dir-'+rid+'-'+d;
      var dlbl = (DIR_LABELS[rid]&&DIR_LABELS[rid][d]!==undefined) ? DIR_LABELS[rid][d] : (d===0?'→ A':'← B');
      db.innerHTML=
        '<div class="dir-pip" id="dip-'+rid+'-'+d+'" style="background:'+r.color+'"></div>'+
        '<span class="dir-lbl" id="dirl-'+rid+'-'+d+'">'+dlbl+'</span>'+
        '<span class="dir-ct"  id="dirc-'+rid+'-'+d+'">–</span>';
      db.onclick=function(e){e.stopPropagation();toggleDir(rid,d);};
      dl.appendChild(db);
    });

    block.appendChild(head);
    block.appendChild(dl);
    c.appendChild(block);
  });
}

function fillDirLabels(){
  if(!TRIPS||!TRIPS.d) return;
  Object.keys(TRIPS.d).forEach(function(rid){
    var dirs=TRIPS.d[rid];
    [0,1].forEach(function(d){
      var el=document.getElementById('dirl-'+rid+'-'+d);
      if(el&&dirs[d]) el.textContent=dirs[d];
    });
  });
}

function setView(v){
  activeView=v;
  ['all','tram','bus'].forEach(function(t){document.getElementById('tab-'+t).classList.toggle('on',t===v);});
  // Si on passe en TRAM : décocher les bus, cocher les trams
  // Si on passe en BUS  : décocher les trams, cocher les bus
  // Si TOUT : tout cocher
  if(v==='tram'){
    TRAM_IDS.forEach(function(rid){setRouteState(rid,true,true);});
    BUS_IDS.forEach(function(rid){setRouteState(rid,false,false);});
  } else if(v==='bus'){
    BUS_IDS.forEach(function(rid){setRouteState(rid,true,true);});
    TRAM_IDS.forEach(function(rid){setRouteState(rid,false,false);});
  } else {
    Object.keys(pickState).forEach(function(rid){setRouteState(rid,true,true);});
  }
  updateMarkers();
}

function setRouteState(rid,d0,d1){
  if(!pickState[rid]) pickState[rid]={};
  pickState[rid][0]=d0; pickState[rid][1]=d1;
  refreshBlockStyle(rid);
}

function toggleRouteAll(rid){
  var ps=pickState[rid];
  var anyOn=ps[0]||ps[1];
  setRouteState(rid,!anyOn,!anyOn);
  updateMarkers();
}

function toggleDir(rid,d){
  pickState[rid][d]=!pickState[rid][d];
  refreshBlockStyle(rid);
  updateMarkers();
}

function refreshBlockStyle(rid){
  var ps=pickState[rid];
  var block=document.getElementById('rblock-'+rid);
  if(block) block.classList.toggle('off',!ps[0]&&!ps[1]);
  [0,1].forEach(function(d){
    var db=document.getElementById('dir-'+rid+'-'+d);
    if(db){db.classList.toggle('on',ps[d]);}
  });
}

function selectAll(val){
  // Respecte la vue courante : ne coche que ce qui est pertinent
  var ids=activeView==='tram'?TRAM_IDS:activeView==='bus'?BUS_IDS:Object.keys(pickState);
  ids.forEach(function(rid){setRouteState(rid,val,val);});
  updateMarkers();
}

function toggleSec(id){
  var body=document.getElementById(id);
  var arr=document.getElementById(id+'-arr');
  var hidden=body.style.display==='none';
  body.style.display=hidden?'':'none';
  if(arr)arr.classList.toggle('closed',!hidden);
}

// ═══════════════════════════════
// ARRÊTS
// ═══════════════════════════════
function buildStopMarkers(){
  Object.values(STOPS).forEach(function(s){
    var icon=L.divIcon({className:'',html:'<div class="sdot"></div>',iconSize:[7,7],iconAnchor:[3.5,3.5]});
    var m=L.marker([s[1],s[2]],{icon:icon,interactive:true,zIndexOffset:-200});
    m.bindTooltip(s[0],{direction:'top',offset:[0,-4]});
    stopMarkers.push(m);
  });
}
function toggleStops(){
  stopsVisible=!stopsVisible;
  document.getElementById('stops-btn').classList.toggle('on',stopsVisible);
  stopMarkers.forEach(function(m){stopsVisible?m.addTo(mapObj):mapObj.removeLayer(m);});
}

// ═══════════════════════════════
// BOOTSTRAP
// ═══════════════════════════════
async function bootstrap(){
  try{
    setTxt('Chargement Leaflet…');
    try{await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');}
    catch(e){await loadScript('https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js');}
    setTxt('Chargement protobufjs…');
    try{await loadScript('https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js');}
    catch(e){await loadScript('https://unpkg.com/protobufjs@7.2.5/dist/protobuf.min.js');}

    setTxt('Initialisation carte…');
    mapObj=L.map('map',{center:[43.6117,3.8767],zoom:13});
    window._DT=L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {attribution:'© OSM © CARTO',subdomains:'abcd',maxZoom:19});
    window._LT=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OSM © CARTO',subdomains:'abcd',maxZoom:19});
    (document.documentElement.classList.contains('light')?window._LT:window._DT).addTo(mapObj);

    buildSidebar();
    buildStopMarkers();

    setTxt('Décodage proto…');
    var root=protobuf.parse(PROTO,{keepCase:true}).root;
    FeedMsg=root.lookupType('FeedMessage');

    xhrJSON(TRIPS_URL).then(function(d){
      TRIPS=d; fillDirLabels();
      vehicles.forEach(function(v){if(markers[v.id]){try{var p=markers[v.id].getPopup();if(p)p.setContent(mkPopup(v));}catch(e){}}});
    }).catch(function(e){console.warn('trips:',e.message);});

    setTxt('Récupération des véhicules…');
    await fetchVehicles();
    document.getElementById('refresh-btn').disabled=false;
    interval=setInterval(fetchVehicles,REFRESH_MS);
  }catch(err){console.error(err);setStatus('error');hideOverlay();showErr('Erreur: '+err.message);}
}

// ═══════════════════════════════
// FETCH
// ═══════════════════════════════
async function fetchVehicles(){
  setStatus('loading');hideErr();
  try{
    var buf=await xhrBin(GTFS_URL,12000);
    var msg=FeedMsg.decode(new Uint8Array(buf));
    vehicles=(msg.entity||[]).filter(function(e){return e.vehicle&&e.vehicle.position;}).map(function(e){
      var v=e.vehicle,tid=(v.trip&&v.trip.trip_id)||'',rid=(v.trip&&v.trip.route_id)||'';
      var info=getInfo(tid,rid);
      return{id:e.id,tripId:tid,lat:v.position.latitude,lng:v.position.longitude,
             bearing:v.position.bearing||0,speed:v.position.speed||0,
             rid:info.rid,headsign:info.headsign,dir:info.dir,label:v.label||e.id,ts:v.timestamp||0};
    });
    updateMarkers();updateStats();updateCounts();
    setStatus('live');hideOverlay();restartTimer();
  }catch(err){console.error(err);setStatus('error');hideOverlay();showErr('Erreur: '+err.message);}
}

// ═══════════════════════════════
// MARQUEURS
// ═══════════════════════════════
function mkIcon(v){
  var r=v.rid?ROUTES[v.rid]:null;
  var color=r?r.color:'#6b7280',tc=r?r.text:'#fff';
  var isTram=r&&r.type===0,lbl=r?r.short:'?',sz=isTram?32:26;
  var dark=(tc==='#000'||tc==='#000000')?' dk':'';
  return L.divIcon({className:'',
    html:'<div class="vw" style="transform:rotate('+v.bearing+'deg)">'+
         '<div class="va"></div>'+
         '<div class="vm'+(isTram?'':' bus')+dark+'" style="width:'+sz+'px;height:'+sz+'px;background:'+color+'">'+lbl+'</div>'+
         '</div>',
    iconSize:[sz,sz+6],iconAnchor:[sz/2,sz/2+6]});
}

function mkPopup(v){
  var r=v.rid?ROUTES[v.rid]:null;
  var color=r?r.color:'#6b7280',tc=r?r.text:'#fff';
  var isTram=r&&r.type===0,lbl=r?r.short:'?';
  var lname=r?'Ligne '+r.short:'Véhicule',llong=r?r.long:'';
  var time=v.ts?new Date(v.ts*1000).toLocaleTimeString('fr-FR'):'–';
  var spd=v.speed>0.5?Math.round(v.speed*3.6):0;
  var dirLabel='';
  if(v.dir>=0&&TRIPS&&TRIPS.d&&TRIPS.d[v.rid]&&TRIPS.d[v.rid][v.dir])dirLabel=TRIPS.d[v.rid][v.dir];
  else if(v.headsign)dirLabel=v.headsign;
  var sqC=isTram?'':' sq';
  return '<div>'+
    '<div class="ph">'+
      '<div class="pbadge'+sqC+'" style="background:'+color+';color:'+tc+'">'+lbl+'</div>'+
      '<div><div class="ptitle">'+lname+'</div>'+
      (llong?'<div class="plong">'+llong+'</div>':'')+
      (dirLabel?'<div class="phs">→ '+dirLabel+'</div>':'')+
      '</div></div>'+
    '<div class="prow"><span class="pkey">'+(isTram?'🚊 Tram':'🚌 Bus')+'</span><span class="pval">#'+v.label+'</span></div>'+
    '<div class="prow"><span class="pkey">Vitesse</span><span class="pval">'+(spd>0?spd+' km/h':'À l\'arrêt')+'</span></div>'+
    (spd>0?'<div class="spdb"><div class="spdf" style="width:'+Math.min(100,Math.round(spd/70*100))+'%;background:'+color+'"></div></div>':'')+
    '<div class="prow"><span class="pkey">Cap</span><span class="pval">'+Math.round(v.bearing)+'°</span></div>'+
    '<div class="prow"><span class="pkey">MAJ</span><span class="pval">'+time+'</span></div>'+
    '</div>';
}

function updateMarkers(){
  var ids={};vehicles.forEach(function(v){ids[v.id]=true;});
  Object.keys(markers).forEach(function(id){if(!ids[id]){mapObj.removeLayer(markers[id]);delete markers[id];}});
  vehicles.forEach(function(v){
    var vis=isVisible(v),icon=mkIcon(v);
    if(markers[v.id]){
      markers[v.id].setLatLng([v.lat,v.lng]);markers[v.id].setIcon(icon);
      try{var p=markers[v.id].getPopup();if(p)p.setContent(mkPopup(v));}catch(e){}
    }else{
      var m=L.marker([v.lat,v.lng],{icon:icon,zIndexOffset:100});
      m.bindPopup(mkPopup(v),{maxWidth:250});
      m.on('mouseover',function(){this.openPopup();});
      markers[v.id]=m;
    }
    vis?markers[v.id].addTo(mapObj):mapObj.removeLayer(markers[v.id]);
  });
}

// ═══════════════════════════════
// STATS
// ═══════════════════════════════
function updateStats(){
  var tr=0,bu=0;
  vehicles.forEach(function(v){if(!v.rid)return;TRAM_IDS.indexOf(v.rid)>=0?tr++:bu++;});
  document.getElementById('st-tram').textContent=tr;
  document.getElementById('st-bus').textContent=bu;
  document.getElementById('st-upd').textContent=new Date().toLocaleTimeString('fr-FR');
  document.getElementById('vehicle-count').textContent=vehicles.length+' véhicules';
}
function updateCounts(){
  var c={};
  vehicles.forEach(function(v){
    if(!v.rid)return;
    if(!c[v.rid])c[v.rid]={0:0,1:0,tot:0};
    c[v.rid].tot++;
    if(v.dir===0)c[v.rid][0]++;else if(v.dir===1)c[v.rid][1]++;
  });
  Object.keys(ROUTES).forEach(function(rid){
    var el=document.getElementById('rc-'+rid);
    if(el)el.textContent=c[rid]?c[rid].tot:0;
    [0,1].forEach(function(d){
      var de=document.getElementById('dirc-'+rid+'-'+d);
      if(de)de.textContent=c[rid]?c[rid][d]:0;
    });
  });
}

// ═══════════════════════════════
// UI
// ═══════════════════════════════
function setStatus(s){var dot=document.getElementById('sdot'),txt=document.getElementById('stxt');if(s==='loading'){dot.className='dot';txt.textContent='Chargement…';}else if(s==='live'){dot.className='dot live';txt.textContent='EN DIRECT';}else{dot.className='dot error';txt.textContent='ERREUR';}}
function setTxt(t){document.getElementById('ltxt').textContent=t;}
function showErr(m){var b=document.getElementById('error-banner');b.innerHTML=m;b.style.display='block';}
function hideErr(){document.getElementById('error-banner').style.display='none';}
function hideOverlay(){document.getElementById('overlay').classList.add('hidden');}
function manualRefresh(){clearInterval(interval);fetchVehicles();interval=setInterval(fetchVehicles,REFRESH_MS);}
function restartTimer(){var bar=document.getElementById('timer-bar');bar.style.transition='none';bar.style.width='100%';requestAnimationFrame(function(){requestAnimationFrame(function(){bar.style.transition='width '+REFRESH_MS+'ms linear';bar.style.width='0%';});});}

bootstrap();
</script>
