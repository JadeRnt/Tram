<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaM Live · Montpellier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg:#0a0c10;--surface:#12151c;--border:#1e2330;
  --accent:#e8f439;--accent2:#39c5f4;--text:#e8eaf0;--muted:#6b7280;
  --sidebar:260px;
}
:root.light{
  --bg:#f0f2f5;--surface:#ffffff;--border:#d1d5db;
  --accent:#6b7a00;--accent2:#0284c7;--text:#111827;--muted:#6b7280;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;transition:background .25s,color .25s}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:1000;gap:8px}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.logo h1{font-size:.95rem;font-weight:800;letter-spacing:-.02em}
.logo span{display:block;font-family:'Space Mono',monospace;font-size:.55rem;color:var(--muted);letter-spacing:.06em;margin-top:1px}
.hright{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.status-pill{display:flex;align-items:center;gap:6px;background:var(--border);padding:4px 10px;border-radius:999px;font-family:'Space Mono',monospace;font-size:.62rem;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.live{background:#22c55e;animation:pulse 2s infinite}
.dot.error{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#vehicle-count{font-family:'Space Mono',monospace;font-size:.68rem;color:var(--accent);white-space:nowrap}
.ibtn{background:none;border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;font-family:'Space Mono',monospace;font-size:.62rem;cursor:pointer;transition:all .15s;letter-spacing:.04em;display:flex;align-items:center;gap:4px;white-space:nowrap}
.ibtn:hover,.ibtn.on{border-color:var(--accent);color:var(--accent)}
.ibtn:disabled{opacity:.35;cursor:not-allowed}

/* LAYOUT */
.main{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-head{padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-label{font-family:'Space Mono',monospace;font-size:.55rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.view-tabs{display:flex;gap:4px}
.vtab{flex:1;padding:5px 4px;border:1px solid var(--border);border-radius:5px;font-family:'Space Mono',monospace;font-size:.6rem;cursor:pointer;background:none;color:var(--muted);transition:all .15s;text-align:center;letter-spacing:.03em}
.vtab.on{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}

.sidebar-scroll{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px;cursor:pointer;user-select:none}
.section-title{font-family:'Space Mono',monospace;font-size:.58rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.section-toggle{font-size:.6rem;color:var(--muted);transition:transform .2s}
.section-toggle.closed{transform:rotate(-90deg)}
.route-list{display:flex;flex-direction:column;gap:3px;padding:0 8px 8px}
.route-btn{display:flex;align-items:center;gap:7px;background:none;border:1px solid transparent;border-radius:6px;padding:5px 8px;cursor:pointer;transition:all .12s;font-family:'Syne',sans-serif;color:var(--text);text-align:left;width:100%;min-height:34px}
.route-btn:hover{background:rgba(128,128,128,.08);border-color:var(--border)}
.route-btn.sel{background:rgba(128,128,128,.12);border-color:var(--border)}
.route-btn.off{opacity:.25}
.rbadge{min-width:28px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;flex-shrink:0;padding:0 4px;letter-spacing:-.01em}
.rinfo{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.rname{font-size:.73rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdesc{font-size:.55rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcount{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--muted);flex-shrink:0;min-width:20px;text-align:right}

/* Stats */
.stats-section{padding:10px 12px;border-top:1px solid var(--border);flex-shrink:0}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 9px}
.stat-val{font-family:'Space Mono',monospace;font-size:1.1rem;font-weight:700;color:var(--accent);line-height:1}
.stat-lbl{font-size:.55rem;color:var(--muted);margin-top:2px}
.info-link{padding:8px 12px;border-top:1px solid var(--border);font-size:.6rem;color:var(--muted);flex-shrink:0;line-height:1.5}
.info-link a{color:var(--accent2);text-decoration:none;font-family:'Space Mono',monospace;font-size:.58rem}

/* MAP */
#map{flex:1;background:#0e1117}
#overlay{position:absolute;inset:0;background:rgba(10,12,16,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:12px}
#overlay.hidden{display:none}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-family:'Space Mono',monospace;font-size:.68rem;color:var(--muted);letter-spacing:.08em}

/* MARQUEURS */
.vmarker{
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:2.5px solid rgba(255,255,255,.9);
  font-family:'Syne',sans-serif;font-weight:800;font-size:11px;
  color:white;box-shadow:0 2px 8px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.25);
  cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.5);line-height:1;
}
.vmarker.dark-text{color:#111!important;text-shadow:none!important;border-color:rgba(0,0,0,.35)!important}
/* Tram: cercle, Bus: carré arrondi */
.vmarker.bus{border-radius:5px!important;font-size:9px!important}
/* Flèche direction */
.vmarker-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.vmarker-arrow{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid rgba(255,255,255,.85);pointer-events:none}

.stop-dot{width:6px;height:6px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.25)}

/* POPUP */
.leaflet-popup-content-wrapper{background:var(--surface)!important;border:1px solid var(--border);border-radius:10px!important;box-shadow:0 4px 20px rgba(0,0,0,.7)!important;color:var(--text)!important;font-family:'Syne',sans-serif}
.leaflet-popup-tip{background:var(--surface)!important}
.leaflet-popup-content{margin:11px 14px!important;min-width:200px;max-width:240px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.pbadge{min-width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;padding:0 5px;flex-shrink:0}
.pbadge.bus-badge{border-radius:5px}
.ptitle{font-weight:800;font-size:.85rem}
.plong{font-size:.58rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.phs{font-size:.64rem;color:var(--accent2);margin-top:2px;display:flex;align-items:center;gap:3px}
.prow{display:flex;justify-content:space-between;align-items:center;font-size:.68rem;padding:3px 0;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.pkey{color:var(--muted)}
.pval{font-family:'Space Mono',monospace;font-size:.62rem;font-weight:700}
.spd-bar{height:3px;background:var(--border);border-radius:2px;margin-top:5px;overflow:hidden}
.spd-fill{height:100%;border-radius:2px}

/* TIMER */
#error-banner{display:none;background:#160a0a;border-bottom:1px solid #7f1d1d;color:#fca5a5;padding:7px 14px;font-family:'Space Mono',monospace;font-size:.62rem;text-align:center;flex-shrink:0}
.timer-wrap{height:2px;background:var(--border);flex-shrink:0}
.timer-bar{height:100%;background:var(--accent);width:100%}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🚊</div>
    <div><h1>TaM Live</h1><span>MONTPELLIER · TEMPS RÉEL</span></div>
  </div>
  <div class="hright">
    <span id="vehicle-count">— véhicules</span>
    <div class="status-pill"><div class="dot" id="sdot"></div><span id="stxt">Initialisation…</span></div>
    <button class="ibtn" id="stops-btn" onclick="toggleStops()">⬤ ARRÊTS</button>
    <button class="ibtn" id="theme-btn" onclick="toggleTheme()"><span id="ticon">☀️</span><span id="tlabel">LIGHT</span></button>
    <button class="ibtn" id="refresh-btn" onclick="manualRefresh()" disabled>⟳ ACTUALISER</button>
  </div>
</header>

<div id="error-banner"></div>
<div class="timer-wrap"><div class="timer-bar" id="timer-bar"></div></div>

<div style="position:relative;flex:1;display:flex;overflow:hidden">
  <div id="overlay"><div class="spinner"></div><div class="loading-text" id="ltxt">CHARGEMENT…</div></div>

  <div class="main" style="flex:1;display:flex;overflow:hidden">
    <div class="sidebar">
      <!-- Onglets vue -->
      <div class="sidebar-head">
        <div class="sidebar-label">Affichage</div>
        <div class="view-tabs">
          <button class="vtab on"  id="tab-all"   onclick="setView('all')">Tout</button>
          <button class="vtab"     id="tab-tram"  onclick="setView('tram')">🚊 Trams</button>
          <button class="vtab"     id="tab-bus"   onclick="setView('bus')">🚌 Bus</button>
          <button class="vtab"     id="tab-pick"  onclick="setView('pick')">✏️ Choix</button>
        </div>
      </div>

      <div class="sidebar-scroll" id="sidebar-scroll">
        <!-- Section Trams -->
        <div class="section-header" onclick="toggleSection('tram-section')">
          <div class="section-title">🚊 <span>Trams</span></div>
          <span class="section-toggle" id="tram-section-arrow">▾</span>
        </div>
        <div id="tram-section" class="route-list"></div>

        <!-- Section Bus -->
        <div class="section-header" onclick="toggleSection('bus-section')">
          <div class="section-title">🚌 <span>Bus</span></div>
          <span class="section-toggle" id="bus-section-arrow">▾</span>
        </div>
        <div id="bus-section" class="route-list"></div>
      </div>

      <div class="stats-section">
        <div class="sidebar-label">Statistiques</div>
        <div class="stat-grid">
          <div class="stat-card"><div class="stat-val" id="st-tram">–</div><div class="stat-lbl">Trams actifs</div></div>
          <div class="stat-card"><div class="stat-val" id="st-bus">–</div><div class="stat-lbl">Bus actifs</div></div>
          <div class="stat-card" style="grid-column:span 2"><div class="stat-val" style="font-size:.75rem" id="st-update">–</div><div class="stat-lbl">Dernière MAJ</div></div>
        </div>
      </div>
      <div class="info-link">
        Données GTFS-RT <strong>Montpellier Méditerranée Métropole</strong> (ODbL) · 10 s<br>
        <a href="https://data.montpellier3m.fr/dataset/offre-de-transport-tam-en-temps-reel" target="_blank">→ Source Open Data M3M</a>
      </div>
    </div>
    <div id="map"></div>
  </div>
</div>

var PROTO = `syntax="proto2";
message FeedMessage{required FeedHeader header=1;repeated FeedEntity entity=2;}
message FeedHeader{required string gtfs_realtime_version=1;optional uint64 timestamp=3;}
message FeedEntity{required string id=1;optional VehiclePosition vehicle=4;}
message VehiclePosition{optional TripDescriptor trip=1;optional Position position=2;optional uint64 timestamp=4;optional string label=6;}
message TripDescriptor{optional string trip_id=1;optional string route_id=5;}
message Position{required float latitude=1;required float longitude=2;optional float bearing=3;optional float speed=4;}`;

function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
}
function xhrBinary(url,ms){
  return new Promise(function(res,rej){
    var x=new XMLHttpRequest();x.open('GET',url,true);x.responseType='arraybuffer';x.timeout=ms||12000;
    x.ontimeout=function(){rej(new Error('Timeout'));};
    x.onerror=function(){rej(new Error('Réseau KO'));};
    x.onload=function(){x.status>=200&&x.status<300?res(x.response):rej(new Error('HTTP '+x.status));};
    x.send();
  });
}
function xhrJSON(url){
  return new Promise(function(res,rej){
    var x=new XMLHttpRequest();x.open('GET',url,true);x.timeout=20000;
    x.ontimeout=function(){rej(new Error('Timeout trips'));};
    x.onerror=function(){rej(new Error('Réseau KO trips'));};
    x.onload=function(){
      if(x.status>=200&&x.status<300){ try{res(JSON.parse(x.responseText));}catch(e){rej(e);} }
      else rej(new Error('HTTP '+x.status));
    };
    x.send();
  });
}

function getVehicleInfo(tripId, routeId){
  var rid = (routeId && ROUTES[routeId]) ? routeId : null;
  var headsign = null;
  // Fallback via trips
  if(TRIPS && tripId && TRIPS.t[tripId]){
    var entry = TRIPS.t[tripId];
    if(!rid && entry[0] >= 0) rid = TRIPS.k[entry[0]];
    headsign = entry[1];
  }
  return { lineId: rid, headsign: headsign };
}

function isVisible(v){
  if(!v.lineId) return activeView !== 'tram' && activeView !== 'bus';
  var isTram = TRAM_IDS.indexOf(v.lineId) >= 0;
  if(activeView === 'all')  return true;
  if(activeView === 'tram') return isTram;
  if(activeView === 'bus')  return !isTram;
  if(activeView === 'pick') return !!selectedRoutes[v.lineId];
  return false;
}

// ═══════════════════════════════════════════════════
function buildSidebar(){
  buildSection('tram-section', TRAM_IDS);
  buildSection('bus-section', BUS_IDS);
}
function buildSection(containerId, ids){
  var c = document.getElementById(containerId);
  ids.forEach(function(rid){
    var r = ROUTES[rid];
    if(!r) return;
    var isTram = r.type === 0;
    var btn = document.createElement('button');
    btn.className = 'route-btn sel';
    btn.dataset.rid = rid;
    btn.onclick = function(){ toggleRoute(rid); };
    btn.innerHTML =
      '<div class="rbadge'+(isTram?'':' bus-badge')+'" style="background:'+r.color+';color:'+r.text+'">'+r.short+'</div>'+
      '<div class="rinfo"><div class="rname">Ligne '+r.short+'</div><div class="rdesc">'+r.long+'</div></div>'+
      '<span class="rcount" id="rc-'+rid+'">–</span>';
    c.appendChild(btn);
    selectedRoutes[rid] = true; // tout sélectionné par défaut
  });
}

// ═══════════════════════════════════════════════════
// VUES
// ═══════════════════════════════════════════════════
function setView(v){
  activeView = v;
  ['all','tram','bus','pick'].forEach(function(t){
    document.getElementById('tab-'+t).classList.toggle('on', t===v);
  });
  // En mode pick, les boutons de route sont cliquables
  document.querySelectorAll('.route-btn').forEach(function(b){
    b.style.pointerEvents = (v==='pick') ? '' : 'none';
    if(v !== 'pick') b.classList.remove('off');
  });
  if(v==='pick'){
    // Remettre l'état visuel
    document.querySelectorAll('.route-btn').forEach(function(b){
      var rid = b.dataset.rid;
      b.classList.toggle('off', !selectedRoutes[rid]);
    });
  }
  updateMarkers();
}

function toggleRoute(rid){
  if(activeView !== 'pick') return;
  selectedRoutes[rid] = !selectedRoutes[rid];
  var btn = document.querySelector('.route-btn[data-rid="'+rid+'"]');
  if(btn) btn.classList.toggle('off', !selectedRoutes[rid]);
  updateMarkers();
}

function toggleSection(id){
  var el = document.getElementById(id);
  var arrow = document.getElementById(id+'-arrow');
  var hidden = el.style.display === 'none';
  el.style.display = hidden ? '' : 'none';
  if(arrow) arrow.classList.toggle('closed', !hidden);
}

function buildStopMarkers(){
  Object.values(STOPS).forEach(function(s){
    var icon = L.divIcon({className:'',html:'<div class="stop-dot"></div>',iconSize:[6,6],iconAnchor:[3,3]});
    var m = L.marker([s[1],s[2]],{icon:icon,interactive:true,zIndexOffset:-200});
    m.bindTooltip(s[0],{direction:'top',offset:[0,-4]});
    stopMarkers.push(m);
  });
}
function toggleStops(){
  stopsVisible = !stopsVisible;
  var btn = document.getElementById('stops-btn');
  btn.classList.toggle('on', stopsVisible);
  stopMarkers.forEach(function(m){ stopsVisible ? m.addTo(mapObj) : mapObj.removeLayer(m); });
}

async function bootstrap(){

    setTxt('Initialisation carte…');
    mapObj = L.map('map',{center:[43.6117,3.8767],zoom:13});
    window._DT = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {attribution:'© OSM © CARTO',subdomains:'abcd',maxZoom:19});
    window._LT = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OSM © CARTO',subdomains:'abcd',maxZoom:19});
    (document.documentElement.classList.contains('light')?window._LT:window._DT).addTo(mapObj);

    buildSidebar();
    buildStopMarkers();

    setTxt('Décodage proto…');
    var root = protobuf.parse(PROTO,{keepCase:true}).root;
    FeedMsg = root.lookupType('FeedMessage');

    // Charger trips en arrière-plan (non bloquant)
    xhrJSON(TRIPS_URL).then(function(d){
      TRIPS = d;
      tripsLoaded = true;
      // Rafraîchir les popups ouvertes avec headsign
      vehicles.forEach(function(v){
        if(markers[v.id]){
          var p = markers[v.id].getPopup();
          if(p) p.setContent(mkPopup(v));
        }
      });
    }).catch(function(e){ console.warn('trips non chargés:', e.message); });

    setTxt('Récupération des véhicules…');
    await fetchVehicles();
    document.getElementById('refresh-btn').disabled = false;
    interval = setInterval(fetchVehicles, REFRESH_MS);
  }catch(err){
    console.error(err); setStatus('error'); hideOverlay();
    showErr('Erreur démarrage : '+err.message);
  }
}

// ═══════════════════════════════════════════════════
// FETCH TEMPS RÉEL
// ═══════════════════════════════════════════════════
async function fetchVehicles(){
  setStatus('loading'); hideErr();
  try{
    var buf = await xhrBinary(GTFS_URL, 12000);
    var msg = FeedMsg.decode(new Uint8Array(buf));

    vehicles = (msg.entity||[])
      .filter(function(e){ return e.vehicle && e.vehicle.position; })
      .map(function(e){
        var v = e.vehicle;
        var tid = (v.trip&&v.trip.trip_id)||'';
        var rid = (v.trip&&v.trip.route_id)||'';
        var info = getVehicleInfo(tid, rid);
        return {
          id: e.id, tripId: tid,
          lat: v.position.latitude, lng: v.position.longitude,
          bearing: v.position.bearing||0, speed: v.position.speed||0,
          lineId: info.lineId, headsign: info.headsign,
          label: v.label||e.id, ts: v.timestamp||0
        };
      });

    updateMarkers(); updateStats(); updateCounts();
    setStatus('live'); hideOverlay(); restartTimer();
  }catch(err){
    console.error(err); setStatus('error'); hideOverlay();
    showErr('Erreur : '+err.message);
  }
}

// ═══════════════════════════════════════════════════
// MARQUEURS
// ═══════════════════════════════════════════════════
function mkIcon(v){
  var r = v.lineId ? ROUTES[v.lineId] : null;
  var color  = r ? r.color  : '#6b7280';
  var tcolor = r ? r.text   : '#fff';
  var isTram = r && r.type === 0;
  var lbl    = r ? r.short  : '?';
  var sz     = isTram ? 32 : 26;
  var dark   = (tcolor === '#000' || tcolor === '#000000') ? ' dark-text' : '';
  var busClass = isTram ? '' : ' bus';
  // Flèche de direction
  var arrowStyle = 'transform:rotate('+v.bearing+'deg)';
  var arrowHtml = '<div class="vmarker-arrow"></div>';
  var innerHtml =
    '<div class="vmarker-wrap" style="'+arrowStyle+'">'+
      arrowHtml+
      '<div class="vmarker'+busClass+dark+'" style="width:'+sz+'px;height:'+sz+'px;background:'+color+'">'+lbl+'</div>'+
    '</div>';
  return L.divIcon({className:'',html:innerHtml,iconSize:[sz,sz+7],iconAnchor:[sz/2,sz/2+7]});
}

function mkPopup(v){
  var r = v.lineId ? ROUTES[v.lineId] : null;
  var color  = r ? r.color  : '#6b7280';
  var tcolor = r ? r.text   : '#fff';
  var isTram = r && r.type === 0;
  var lbl    = r ? r.short  : '?';
  var lname  = r ? 'Ligne '+r.short  : 'Véhicule '+v.label;
  var llong  = r ? r.long : '';
  var time   = v.ts ? new Date(v.ts*1000).toLocaleTimeString('fr-FR') : '–';
  var spd    = v.speed > 0.5 ? Math.round(v.speed*3.6) : 0;
  var spdStr = spd > 0 ? spd+' km/h' : 'À l\'arrêt';
  var spdPct = Math.min(100, Math.round(spd/70*100));
  var hsHtml = v.headsign ? '<div class="phs">→ '+v.headsign+'</div>' : '';
  var busClass = isTram ? '' : ' bus-badge';
  return '<div>'+
    '<div class="ph">'+
      '<div class="pbadge'+busClass+'" style="background:'+color+';color:'+tcolor+'">'+lbl+'</div>'+
      '<div><div class="ptitle">'+lname+'</div>'+
      (llong?'<div class="plong">'+llong+'</div>':'')+
      hsHtml+'</div>'+
    '</div>'+
    '<div class="prow"><span class="pkey">'+(isTram?'🚊':'🚌')+' Type</span><span class="pval">'+(isTram?'Tramway':'Bus')+'</span></div>'+
    '<div class="prow"><span class="pkey">Véhicule</span><span class="pval">#'+v.label+'</span></div>'+
    '<div class="prow"><span class="pkey">Vitesse</span><span class="pval">'+spdStr+'</span></div>'+
    (spdPct>0?'<div class="spd-bar"><div class="spd-fill" style="width:'+spdPct+'%;background:'+color+'"></div></div>':'')+
    '<div class="prow"><span class="pkey">Cap</span><span class="pval">'+Math.round(v.bearing)+'°</span></div>'+
    '<div class="prow"><span class="pkey">Position MAJ</span><span class="pval">'+time+'</span></div>'+
    '</div>';
}

function updateMarkers(){
  var ids = {};
  vehicles.forEach(function(v){ ids[v.id]=true; });
  Object.keys(markers).forEach(function(id){
    if(!ids[id]){ mapObj.removeLayer(markers[id]); delete markers[id]; }
  });
  vehicles.forEach(function(v){
    var vis = isVisible(v);
    var icon = mkIcon(v);
    if(markers[v.id]){
      markers[v.id].setLatLng([v.lat,v.lng]);
      markers[v.id].setIcon(icon);
      try{ var p=markers[v.id].getPopup(); if(p) p.setContent(mkPopup(v)); }catch(e){}
    }else{
      var m = L.marker([v.lat,v.lng],{icon:icon,zIndexOffset:100});
      m.bindPopup(mkPopup(v),{maxWidth:250});
      m.on('mouseover',function(){this.openPopup();});
      markers[v.id] = m;
    }
    vis ? markers[v.id].addTo(mapObj) : mapObj.removeLayer(markers[v.id]);
  });
}

// ═══════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════
function updateStats(){
  var trams=0, buses=0;
  vehicles.forEach(function(v){
    if(!v.lineId) return;
    if(TRAM_IDS.indexOf(v.lineId)>=0) trams++;
    else buses++;
  });
  document.getElementById('st-tram').textContent = trams;
  document.getElementById('st-bus').textContent  = buses;
  document.getElementById('st-update').textContent = new Date().toLocaleTimeString('fr-FR');
  var total = vehicles.length;
  document.getElementById('vehicle-count').textContent = total+' véhicules';
}
function updateCounts(){
  var c = {};
  vehicles.forEach(function(v){ if(v.lineId) c[v.lineId]=(c[v.lineId]||0)+1; });
  Object.keys(ROUTES).forEach(function(rid){
    var el = document.getElementById('rc-'+rid);
    if(el) el.textContent = c[rid]||0;
  });
}

// ═══════════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════════
function setStatus(s){
  var dot=document.getElementById('sdot'), txt=document.getElementById('stxt');
  if(s==='loading'){dot.className='dot';txt.textContent='Chargement…';}
  else if(s==='live'){dot.className='dot live';txt.textContent='EN DIRECT';}
  else{dot.className='dot error';txt.textContent='ERREUR';}
}
function setTxt(t){document.getElementById('ltxt').textContent=t;}
function showErr(m){var b=document.getElementById('error-banner');b.innerHTML=m;b.style.display='block';}
function hideErr(){document.getElementById('error-banner').style.display='none';}
function hideOverlay(){document.getElementById('overlay').classList.add('hidden');}
function manualRefresh(){clearInterval(interval);fetchVehicles();interval=setInterval(fetchVehicles,REFRESH_MS);}
function restartTimer(){
  var bar=document.getElementById('timer-bar');
  bar.style.transition='none';bar.style.width='100%';
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    bar.style.transition='width '+REFRESH_MS+'ms linear';bar.style.width='0%';
  });});
}

bootstrap();
</script>
