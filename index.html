<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaM Live · Trams Montpellier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  /* ── Couleurs officielles TaM ── */
  :root {
    --bg:#0a0c10;--surface:#12151c;--border:#1e2330;
    --accent:#e8f439;--accent2:#39c5f4;--text:#e8eaf0;--muted:#6b7280;
    /* Couleurs officielles GTFS */
    --t1:#005CA9;--t2:#EF7D00;--t3:#C8D400;--t4:#4B2A0E;--t5:#287431;
    --t1t:#fff;  --t2t:#000;  --t3t:#000;  --t4t:#fff;  --t5t:#fff;
  }
  :root.light {
    --bg:#f0f2f5;--surface:#ffffff;--border:#d1d5db;
    --accent:#6b7a00;--accent2:#0284c7;--text:#111827;--muted:#6b7280;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;transition:background .3s,color .3s}

  /* ── Header ── */
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:1000;gap:10px}
  .logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .logo-icon{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .logo h1{font-size:1rem;font-weight:800;letter-spacing:-0.02em}
  .logo span{display:block;font-family:'Space Mono',monospace;font-size:0.6rem;color:var(--muted);letter-spacing:0.06em;margin-top:1px}
  .header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .status-pill{display:flex;align-items:center;gap:7px;background:var(--border);padding:5px 12px;border-radius:999px;font-family:'Space Mono',monospace;font-size:0.65rem;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background .3s;flex-shrink:0}
  .dot.live{background:#22c55e;animation:pulse 2s infinite}
  .dot.error{background:#ef4444}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  #vehicle-count{font-family:'Space Mono',monospace;font-size:.72rem;color:var(--accent);white-space:nowrap}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--text);padding:5px 11px;border-radius:6px;font-family:'Space Mono',monospace;font-size:.65rem;cursor:pointer;transition:all .2s;letter-spacing:.05em;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
  .icon-btn:disabled{opacity:.4;cursor:not-allowed}

  /* ── Layout ── */
  .main{display:flex;flex:1;overflow:hidden}
  .sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
  .sidebar-section{padding:14px;border-bottom:1px solid var(--border)}
  .sidebar-label{font-family:'Space Mono',monospace;font-size:.58rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}

  /* ── Boutons lignes ── */
  .line-filter{display:flex;flex-direction:column;gap:5px}
  .line-btn{display:flex;align-items:center;gap:9px;background:none;border:1px solid var(--border);border-radius:7px;padding:6px 10px;cursor:pointer;transition:all .15s;font-family:'Syne',sans-serif;color:var(--text);font-size:.78rem;font-weight:700;text-align:left;width:100%}
  .line-btn:hover{background:var(--border)}
  .line-btn.active{background:rgba(128,128,128,.08)}
  .line-btn.inactive{opacity:.3}
  .line-badge{min-width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;flex-shrink:0;padding:0 4px}
  .line-info{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
  .line-name{font-size:.78rem;font-weight:800}
  .line-desc{font-size:.58rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .line-count{font-family:'Space Mono',monospace;font-size:.62rem;color:var(--muted);flex-shrink:0}

  /* ── Stats ── */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .stat-card{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:9px}
  .stat-value{font-family:'Space Mono',monospace;font-size:1.25rem;font-weight:700;color:var(--accent);line-height:1}
  .stat-label{font-size:.58rem;color:var(--muted);margin-top:3px}
  .info-panel{padding:14px}
  .info-panel p{font-size:.65rem;color:var(--muted);line-height:1.6}
  .info-panel a{color:var(--accent2);text-decoration:none;font-size:.62rem;display:block;margin-top:7px;font-family:'Space Mono',monospace}

  /* ── Carte ── */
  #map{flex:1;background:#0e1117}
  #overlay{position:absolute;inset:0;background:rgba(10,12,16,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:14px}
  #overlay.hidden{display:none}
  .spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-family:'Space Mono',monospace;font-size:.72rem;color:var(--muted);letter-spacing:.08em}

  /* ── Marqueurs tram ── */
  .tram-marker{
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    border:2.5px solid rgba(255,255,255,.9);
    font-family:'Syne',sans-serif;font-weight:800;font-size:13px;
    color:white;
    box-shadow:0 2px 8px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.3);
    cursor:pointer;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
    line-height:1;
    transition:transform .15s;
  }
  .tram-marker.dark-text{color:#000!important;text-shadow:none!important;border-color:rgba(0,0,0,.4)!important}

  /* ── Arrêts ── */
  .stop-marker{
    width:7px;height:7px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.7);
    background:rgba(255,255,255,.3);
  }

  /* ── Popups ── */
  .leaflet-popup-content-wrapper{background:var(--surface)!important;border:1px solid var(--border);border-radius:10px!important;box-shadow:0 4px 24px rgba(0,0,0,.7)!important;color:var(--text)!important;font-family:'Syne',sans-serif}
  .leaflet-popup-tip{background:var(--surface)!important}
  .leaflet-popup-content{margin:12px 15px!important;min-width:190px}
  .popup-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .popup-badge{min-width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;padding:0 5px}
  .popup-line-name{font-weight:800;font-size:.9rem}
  .popup-headsign{font-size:.65rem;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:4px}
  .popup-row{display:flex;justify-content:space-between;align-items:center;font-size:.7rem;padding:4px 0;border-bottom:1px solid var(--border)}
  .popup-row:last-child{border-bottom:none}
  .popup-key{color:var(--muted)}
  .popup-val{font-family:'Space Mono',monospace;font-size:.65rem;font-weight:700}
  .popup-speed-bar{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
  .popup-speed-fill{height:100%;border-radius:2px;transition:width .3s}

  /* ── Banners ── */
  #error-banner{display:none;background:#160a0a;border-bottom:1px solid #7f1d1d;color:#fca5a5;padding:8px 16px;font-family:'Space Mono',monospace;font-size:.65rem;text-align:center;line-height:1.5;flex-shrink:0}
  .timer-wrap{height:2px;background:var(--border);flex-shrink:0}
  .timer-bar{height:100%;background:var(--accent);width:100%}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🚊</div>
    <div><h1>TaM Live</h1><span>MONTPELLIER · TEMPS RÉEL</span></div>
  </div>
  <div class="header-right">
    <span id="vehicle-count">— véhicules</span>
    <div class="status-pill">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">Initialisation…</span>
    </div>
    <button class="icon-btn" id="stops-btn" onclick="toggleStops()">⬤ ARRÊTS</button>
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">
      <span id="theme-icon">☀️</span><span id="theme-label">LIGHT</span>
    </button>
    <button class="icon-btn" id="refresh-btn" onclick="manualRefresh()" disabled>⟳ ACTUALISER</button>
  </div>
</header>

<div id="error-banner"></div>
<div class="timer-wrap"><div class="timer-bar" id="timer-bar"></div></div>

<div style="position:relative;flex:1;display:flex;overflow:hidden">
  <div id="overlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">CHARGEMENT…</div>
  </div>

  <div class="main" style="flex:1;overflow:hidden;display:flex">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Lignes de Tram</div>
        <div class="line-filter" id="line-filter">
          <button class="line-btn active" data-line="ALL" onclick="filterLine('ALL')">
            <div class="line-badge" style="background:#6b7280;color:#fff">∞</div>
            <div class="line-info"><span class="line-name">Toutes les lignes</span></div>
            <span class="line-count" id="count-ALL">–</span>
          </button>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Statistiques</div>
        <div class="stat-grid">
          <div class="stat-card"><div class="stat-value" id="stat-total">–</div><div class="stat-label">Trams actifs</div></div>
          <div class="stat-card"><div class="stat-value" id="stat-lines">–</div><div class="stat-label">Lignes</div></div>
          <div class="stat-card" style="grid-column:span 2"><div class="stat-value" style="font-size:.8rem" id="stat-update">–</div><div class="stat-label">Dernière mise à jour</div></div>
        </div>
      </div>
      <div class="info-panel">
        <p>Données GTFS-RT officielles de <strong>Montpellier Méditerranée Métropole</strong> (ODbL).<br>Actualisation toutes les 10 s.</p>
        <a href="https://data.montpellier3m.fr/dataset/offre-de-transport-tam-en-temps-reel" target="_blank">→ Source Open Data M3M</a>
      </div>
    </div>
    <div id="map"></div>
  </div>
</div>

}

// route_id dans GTFS-RT = directement "1","2","3","4","5"
// trip.trip_id permet de récupérer le headsign depuis TRIPS
function getVehicleInfo(tripId, routeId) {
  // route_id est direct
  var rid = routeId && ROUTES[routeId] ? routeId : null;
  // Si pas de route_id direct, essayer via trip
  if (!rid && tripId && TRIPS[tripId]) rid = TRIPS[tripId][0];
  // Fallback regex (ne devrait plus être nécessaire)
  if (!rid && routeId) {
    var m = routeId.match(/^([1-5])$/);
    if (m) rid = m[1];
  }
  var headsign = null;
  if (tripId && TRIPS[tripId]) headsign = TRIPS[tripId][1];
  return { lineNum: rid, headsign: headsign };
}

// ═══════════════════════════════════════════════════════════
// INIT SIDEBAR LIGNES
// ═══════════════════════════════════════════════════════════
function buildSidebar() {
  var container = document.getElementById('line-filter');
  Object.keys(ROUTES).forEach(function(rid) {
    var r = ROUTES[rid];
    var btn = document.createElement('button');
    btn.className = 'line-btn active';
    btn.dataset.line = rid;
    btn.onclick = function(){ filterLine(rid); };
    btn.innerHTML = '<div class="line-badge" style="background:' + r.color + ';color:' + r.text + '">' + rid + '</div>' +
      '<div class="line-info"><span class="line-name">' + r.name + '</span><span class="line-desc">' + r.long + '</span></div>' +
      '<span class="line-count" id="count-' + rid + '">–</span>';
    container.appendChild(btn);
  });
}

// ═══════════════════════════════════════════════════════════
// BOOTSTRAP
// ═══════════════════════════════════════════════════════════
async function bootstrap() {
  try {
    setTxt('Chargement Leaflet…');
    try { await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'); }
    catch(e) { await loadScript('https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'); }

    setTxt('Chargement protobufjs…');
    try { await loadScript('https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js'); }
    catch(e) { await loadScript('https://unpkg.com/protobufjs@7.2.5/dist/protobuf.min.js'); }

    setTxt('Initialisation carte…');
    mapObj = L.map('map', { center: [43.6117, 3.8767], zoom: 13, zoomControl: true });
    window._darkTiles  = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',  { attribution: '© OSM © CARTO', subdomains: 'abcd', maxZoom: 19 });
    window._lightTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© OSM © CARTO', subdomains: 'abcd', maxZoom: 19 });
    (document.documentElement.classList.contains('light') ? window._lightTiles : window._darkTiles).addTo(mapObj);

    buildSidebar();
    buildStopMarkers();

    setTxt('Décodage proto…');
    var root = protobuf.parse(PROTO, { keepCase: true }).root;
    FeedMsg = root.lookupType('FeedMessage');

    setTxt('Récupération des trams…');
    await fetchVehicles();

    document.getElementById('refresh-btn').disabled = false;
    interval = setInterval(fetchVehicles, REFRESH_MS);
  } catch(err) {
    console.error(err);
    setStatus('error'); hideOverlay();
    showErr('Erreur au démarrage : ' + err.message);
  }
}

// ═══════════════════════════════════════════════════════════
// ARRÊTS
// ═══════════════════════════════════════════════════════════
function buildStopMarkers() {
  Object.values(STOPS).forEach(function(s) {
    var icon = L.divIcon({ className: '', html: '<div class="stop-marker"></div>', iconSize: [7,7], iconAnchor: [3.5,3.5] });
    var m = L.marker([s[1], s[2]], { icon: icon, interactive: true, zIndexOffset: -100 });
    m.bindTooltip(s[0], { direction: 'top', offset: [0, -5], className: '' });
    stopMarkers.push(m);
  });
}
function toggleStops() {
  stopsVisible = !stopsVisible;
  var btn = document.getElementById('stops-btn');
  stopMarkers.forEach(function(m) {
    stopsVisible ? m.addTo(mapObj) : mapObj.removeLayer(m);
  });
  btn.style.borderColor = stopsVisible ? 'var(--accent)' : '';
  btn.style.color = stopsVisible ? 'var(--accent)' : '';
}

// ═══════════════════════════════════════════════════════════
// FETCH TEMPS RÉEL
// ═══════════════════════════════════════════════════════════
async function fetchVehicles() {
  setStatus('loading'); hideErr();
  try {
    var buf = await xhrBinary(GTFS_URL, 12000);
    var msg = FeedMsg.decode(new Uint8Array(buf));

    vehicles = (msg.entity || [])
      .filter(function(e){ return e.vehicle && e.vehicle.position; })
      .map(function(e) {
        var v = e.vehicle;
        var tid = (v.trip && v.trip.trip_id) || '';
        var rid = (v.trip && v.trip.route_id) || '';
        var info = getVehicleInfo(tid, rid);
        return {
          id: e.id, tripId: tid,
          lat: v.position.latitude, lng: v.position.longitude,
          bearing: v.position.bearing || 0, speed: v.position.speed || 0,
          lineNum: info.lineNum, headsign: info.headsign,
          label: v.label || e.id, ts: v.timestamp || 0
        };
      });

    updateMarkers(); updateStats(); updateCounts();
    setStatus('live'); hideOverlay(); restartTimer();
  } catch(err) {
    console.error(err); setStatus('error'); hideOverlay();
    showErr('Erreur : ' + err.message);
  }
}

// ═══════════════════════════════════════════════════════════
// MARQUEURS
// ═══════════════════════════════════════════════════════════
function mkIcon(v) {
  var r = ROUTES[v.lineNum];
  var color = r ? r.color : '#6b7280';
  var textColor = r ? r.text : '#fff';
  var lbl = v.lineNum || '?';
  var sz = v.lineNum ? 32 : 22;
  var darkClass = (textColor === '#000') ? ' dark-text' : '';
  return L.divIcon({
    className: '',
    html: '<div class="tram-marker' + darkClass + '" style="width:' + sz + 'px;height:' + sz + 'px;background:' + color + ';transform:rotate(' + v.bearing + 'deg)">' + lbl + '</div>',
    iconSize: [sz, sz], iconAnchor: [sz/2, sz/2]
  });
}

function mkPopup(v) {
  var r = ROUTES[v.lineNum];
  var color  = r ? r.color : '#6b7280';
  var tcolor = r ? r.text  : '#fff';
  var lname  = r ? r.name  : ('Ligne ' + (v.lineNum || '?'));
  var llong  = r ? r.long  : (v.lineNum ? 'Ligne ' + v.lineNum : 'Véhicule inconnu');
  var time   = v.ts ? new Date(v.ts * 1000).toLocaleTimeString('fr-FR') : '–';
  var spd    = v.speed > 0.5 ? Math.round(v.speed * 3.6) : 0;
  var spdStr = spd > 0 ? spd + ' km/h' : 'À l\'arrêt';
  var maxSpd = 70;
  var spdPct = Math.min(100, Math.round(spd / maxSpd * 100));
  var headsignHtml = v.headsign
    ? '<div class="popup-headsign">→ ' + v.headsign + '</div>'
    : '';

  return '<div>' +
    '<div class="popup-header">' +
      '<div class="popup-badge" style="background:' + color + ';color:' + tcolor + '">' + (v.lineNum||'?') + '</div>' +
      '<div><div class="popup-line-name">' + lname + '</div>' +
      '<div style="font-size:.6rem;color:var(--muted)">' + llong + '</div>' +
      headsignHtml + '</div>' +
    '</div>' +
    '<div class="popup-row"><span class="popup-key">Véhicule</span><span class="popup-val">#' + v.label + '</span></div>' +
    '<div class="popup-row"><span class="popup-key">Vitesse</span><span class="popup-val">' + spdStr + '</span></div>' +
    (spdPct > 0 ? '<div class="popup-speed-bar"><div class="popup-speed-fill" style="width:' + spdPct + '%;background:' + color + '"></div></div>' : '') +
    '<div class="popup-row"><span class="popup-key">Cap</span><span class="popup-val">' + Math.round(v.bearing) + '°</span></div>' +
    '<div class="popup-row"><span class="popup-key">Position MAJ</span><span class="popup-val">' + time + '</span></div>' +
    '</div>';
}

function updateMarkers() {
  var ids = {};
  vehicles.forEach(function(v){ ids[v.id] = true; });
  Object.keys(markers).forEach(function(id){
    if (!ids[id]) { mapObj.removeLayer(markers[id]); delete markers[id]; }
  });
  vehicles.forEach(function(v) {
    var vis = activeFilter === 'ALL' || v.lineNum === activeFilter;
    var icon = mkIcon(v);
    if (markers[v.id]) {
      markers[v.id].setLatLng([v.lat, v.lng]);
      markers[v.id].setIcon(icon);
      try { var p = markers[v.id].getPopup(); if(p) p.setContent(mkPopup(v)); } catch(e) {}
    } else {
      var m = L.marker([v.lat, v.lng], { icon: icon, zIndexOffset: 100 });
      m.bindPopup(mkPopup(v), { maxWidth: 240 });
      m.on('mouseover', function(){ this.openPopup(); });
      markers[v.id] = m;
    }
    vis ? markers[v.id].addTo(mapObj) : mapObj.removeLayer(markers[v.id]);
  });
}

// ═══════════════════════════════════════════════════════════
// FILTRE
// ═══════════════════════════════════════════════════════════
function filterLine(line) {
  activeFilter = (activeFilter === line && line !== 'ALL') ? 'ALL' : line;
  document.querySelectorAll('.line-btn').forEach(function(b) {
    var ok = activeFilter === 'ALL' || b.dataset.line === activeFilter || b.dataset.line === 'ALL';
    b.classList.toggle('active', ok);
    b.classList.toggle('inactive', !ok);
  });
  updateMarkers();
}

// ═══════════════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════════════
function updateStats() {
  document.getElementById('stat-total').textContent = vehicles.length;
  var lines = {};
  vehicles.forEach(function(v){ if(v.lineNum) lines[v.lineNum] = true; });
  document.getElementById('stat-lines').textContent = Object.keys(lines).length;
  document.getElementById('stat-update').textContent = new Date().toLocaleTimeString('fr-FR');
  document.getElementById('vehicle-count').textContent = vehicles.length + ' véhicules';
}
function updateCounts() {
  var c = {};
  vehicles.forEach(function(v){ if(v.lineNum) c[v.lineNum] = (c[v.lineNum]||0)+1; });
  var total = vehicles.length;
  document.getElementById('count-ALL').textContent = total;
  Object.keys(ROUTES).forEach(function(l) {
    var el = document.getElementById('count-' + l);
    if (el) el.textContent = c[l] || 0;
  });
}

// ═══════════════════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════════════════
function setStatus(s) {
  var dot = document.getElementById('status-dot');
  var txt = document.getElementById('status-text');
  if (s === 'loading') { dot.className = 'dot'; txt.textContent = 'Chargement…'; }
  else if (s === 'live') { dot.className = 'dot live'; txt.textContent = 'EN DIRECT'; }
  else { dot.className = 'dot error'; txt.textContent = 'ERREUR'; }
}
function setTxt(t) { document.getElementById('loading-text').textContent = t; }
function showErr(m) { var b = document.getElementById('error-banner'); b.innerHTML = m; b.style.display = 'block'; }
function hideErr() { document.getElementById('error-banner').style.display = 'none'; }
function hideOverlay() { document.getElementById('overlay').classList.add('hidden'); }
function manualRefresh() { clearInterval(interval); fetchVehicles(); interval = setInterval(fetchVehicles, REFRESH_MS); }
function restartTimer() {
  var bar = document.getElementById('timer-bar');
  bar.style.transition = 'none'; bar.style.width = '100%';
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    bar.style.transition = 'width ' + REFRESH_MS + 'ms linear'; bar.style.width = '0%';
  }); });
}

bootstrap();
</script>
</body>
